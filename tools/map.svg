<title id="maptitle">Derivation architecture of the 30 volumes</title>
<desc id="mapdesc">Seven non-biological physics volumes fix a measured substrate at the top; the DNA volume is the bridge in the middle; twenty-two biological volumes emerge below, grouped into inheritance, neural, sensory, organ-system, homeostasis-and-time, and disease tiers.</desc>
